<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient Sfondo: Rosso Bo / Padova Premium -->
    <linearGradient id="unipdRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0205"/>
      <stop offset="40%" stop-color="#800615"/>
      <stop offset="100%" stop-color="#b1091d"/>
    </linearGradient>

    <!-- Gradient Magnete Risonanza (Magnetic Field / Cyan Glow) -->
    <linearGradient id="mriGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Gradient Cuore -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e8f5"/>
    </linearGradient>

    <!-- Gradient Dettagli Oro (Master / Università) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>

    <!-- Filter per Bagliore Magnetico -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo Icona Arrotondata -->
  <rect width="512" height="512" rx="108" fill="url(#unipdRed)"/>

  <!-- Anello Decorativo Perimetrale (Stile Sigillo Accademico) -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8,6" />

  <!-- CAMPO MAGNETICO / TUNNEL RISONANZA MAGNETICA (RMN) -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Onde del campo magnetico concentrico (B0 Field) -->
    <circle cx="256" cy="240" r="180" stroke="url(#mriGlow)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="12,12"/>
    <circle cx="256" cy="240" r="145" stroke="url(#mriGlow)" stroke-width="4" stroke-opacity="0.5"/>
    <circle cx="256" cy="240" r="115" stroke="url(#mriGlow)" stroke-width="7" stroke-dasharray="80,30,40,20"/>
    <circle cx="256" cy="240" r="85" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,4"/>
  </g>

  <!-- SEGNALE DI RADIOFREQUENZA / ONDA ELETTROMAGNETICA (RF PULSE) -->
  <path d="M 50,240 Q 120,240 150,210 T 210,270 T 256,180 T 302,300 T 362,210 T 392,240 Q 420,240 462,240" 
        fill="none" stroke="url(#mriGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.85"/>

  <!-- CUORE ANATOMICO CENTRALE (RMN CARDIACA) -->
  <g transform="translate(0, 10)">
    <!-- Sagoma Cuore -->
    <path d="M 256,335 
             C 242,322 165,260 165,190 
             A 48,48 0 0,1 256,155 
             A 48,48 0 0,1 347,190 
             C 347,260 270,322 256,335 Z" 
          fill="url(#heartGrad)" />

    <!-- Aorta e Archi Vascolari (Sfumati in Blu RMN) -->
    <path d="M 235,158 V 125 C 235,115 245,110 256,110 C 267,110 277,115 277,125 V 142" 
          fill="none" stroke="#4facfe" stroke-width="10" stroke-linecap="round" />

    <!-- Sezioni Mappatura T1/T2 Risonanza sul Cuore (Linee di Slice) -->
    <path d="M 200,185 C 220,210 215,245 235,280" 
          fill="none" stroke="#800615" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 250,195 C 270,220 265,255 285,275" 
          fill="none" stroke="#800615" stroke-width="3" stroke-linecap="round" opacity="0.6" stroke-dasharray="4,3" />

    <!-- Riflesso di Luce Curvo -->
    <path d="M 182,185 A 30,30 0 0,1 232,165" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- TOCCO ACCADEMICO / CAPPELLO LAUREA (SIMBOLO MASTER UNIVERSITARIO) -->
  <g transform="translate(256, 385)">
    <!-- Base / Bordo Cappello -->
    <path d="M -45,22 C -45,28 0,34 0,34 C 0,34 45,28 45,22 L 45,12 C 45,18 0,24 0,24 C 0,24 -45,18 -45,12 Z" fill="url(#goldGrad)" />
    <!-- Rombo Superiore Tocco -->
    <polygon points="0,0 65,12 0,24 -65,12" fill="url(#goldGrad)" />
    <!-- Nappa Accademica -->
    <path d="M 40,15 L 48,28 L 45,40" fill="none" stroke="#ffe259" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="45" cy="41" r="3" fill="#ffe259" />
  </g>

  <!-- TESTO / BADGE "UNIPD" & STELLE D'ECCELLENZA -->
  <g transform="translate(256, 455)" text-anchor="middle">
    <!-- Stella centrale d'eccellenza -->
    <path d="M 0,-15 L 3,-6 L 12,-6 L 5,0 L 7,9 L 0,4 L -7,9 L -5,0 L -12,-6 L -3,-6 Z" fill="url(#goldGrad)" />
    
    <!-- Testo Universitari -->
    <text y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" letter-spacing="3" opacity="0.9">
      UNIVERSITÀ DI PADOVA
    </text>
  </g>
</svg>
