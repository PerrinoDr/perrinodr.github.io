<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo Sfumato -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>

    <!-- Sfumatura per il Cuore -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#e60039"/>
    </linearGradient>

    <!-- Sfumatura per l'Anello di Scansione TC -->
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Icona arrotondata) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>

  <!-- Griglia di Sfondo / Target Tecnologico (TC) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="190" />
    <circle cx="256" cy="256" r="140" stroke-dasharray="6,6" />
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="40" y1="256" x2="472" y2="256" />
  </g>

  <!-- Anello Gantry TC Avanzato (Segmentato e Dinamico) -->
  <g stroke="url(#scannerGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Archi di Scansione -->
    <path d="M 120,256 A 136,136 0 0,1 360,160" />
    <path d="M 392,256 A 136,136 0 0,1 256,392" stroke-dasharray="12,12" />
    <path d="M 150,330 A 136,136 0 0,1 120,256" />
    
    <!-- Punti dati / Detector TC -->
    <circle cx="360" cy="160" r="5" fill="#00f2fe" stroke="none" />
    <circle cx="120" cy="256" r="5" fill="#00f2fe" stroke="none" />
    <circle cx="150" cy="330" r="4" fill="#00f2fe" stroke="none" />
  </g>

  <!-- Scansione Laser Orizzontale (Fascio Tomografico) -->
  <line x1="110" y1="230" x2="402" y2="230" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="4,4" />
  <polygon points="110,230 402,230 380,240 132,240" fill="url(#scannerGrad)" opacity="0.15"/>

  <!-- Cuore Anatomico / Tecnologico -->
  <g transform="translate(0, -5)">
    <!-- Sagoma Cuore PRINCIPALE -->
    <path d="M 256,365 
             C 240,350 150,280 150,200 
             A 55,55 0 0,1 256,160 
             A 55,55 0 0,1 362,200 
             C 362,280 272,350 256,365 Z" 
          fill="url(#heartGrad)" />

    <!-- Struttura Vasi Superiori (Aorta e Arterie) -->
    <path d="M 230,165 V 125 C 230,115 240,110 250,110 C 260,110 265,115 265,125 V 148" 
          fill="none" stroke="#e60039" stroke-width="14" stroke-linecap="round" />
    <path d="M 265,135 C 275,125 290,125 295,135" 
          fill="none" stroke="#e60039" stroke-width="10" stroke-linecap="round" />

    <!-- Tagli Tomografici Interni (Coronarie / Cross-section TC) -->
    <path d="M 210,185 C 230,210 220,250 240,290" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M 270,200 C 290,225 285,260 310,285" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" stroke-dasharray="5,3" />

    <!-- Bagliore di Riflesso sul Cuore -->
    <path d="M 170,195 A 35,35 0 0,1 230,172" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Segnale ECG Integrato / Tracciato -->
  <path d="M 160,390 L 200,390 L 210,375 L 225,410 L 240,355 L 255,400 L 265,390 L 352,390" 
        fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Badge d'Eccellenza Master / Cappello Accademico Stilizzato in Basso -->
  <g transform="translate(256, 435)">
    <!-- Stella dell'Eccellenza/Master -->
    <path d="M 0,-12 L 3,-4 L 11,-4 L 5,1 L 7,9 L 0,4 L -7,9 L -5,1 L -11,-4 L -3,-4 Z" fill="#ffd700" />
  </g>
</svg>
